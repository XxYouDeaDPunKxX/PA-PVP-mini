<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Finding flow</title>
  <desc id="desc">Operational SVG showing inputs moving through adversarial review into structured findings.</desc>

  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#252932" stop-opacity=".78"/>
      <stop offset=".55" stop-color="#191c21" stop-opacity=".70"/>
      <stop offset="1" stop-color="#101215" stop-opacity=".82"/>
    </linearGradient>

    <linearGradient id="flow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7f8792" stop-opacity=".20"/>
      <stop offset=".52" stop-color="#d65a31" stop-opacity=".82"/>
      <stop offset="1" stop-color="#7f8792" stop-opacity=".24"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000000" flood-opacity=".32"/>
    </filter>

    <marker id="arrowOxide" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d65a31"/>
    </marker>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".038" stroke-width="1"/>
    </pattern>

    <style>
      .label { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .15em; }
      .micro { font: 650 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .12em; }
      .body { font: 540 14px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="30" fill="url(#panel)" stroke="#343a44" stroke-opacity=".72"/>
  <rect x="1" y="1" width="1198" height="298" rx="30" fill="url(#grid)"/>

  <text x="74" y="54" class="label" fill="#d65a31">FROM MATERIAL</text>
  <text x="514" y="54" class="label" fill="#d65a31">PRESSURE REVIEW</text>
  <text x="912" y="54" class="label" fill="#d65a31">FINDINGS</text>

  <!-- input chips -->
  <g filter="url(#softShadow)">
    <rect x="66" y="92" width="130" height="42" rx="18" fill="#101215" fill-opacity=".72" stroke="#343a44"/>
    <text x="96" y="119" class="body" fill="#f1f3f0" opacity=".88">answers</text>

    <rect x="222" y="92" width="112" height="42" rx="18" fill="#101215" fill-opacity=".68" stroke="#343a44"/>
    <text x="254" y="119" class="body" fill="#f1f3f0" opacity=".82">plans</text>

    <rect x="96" y="158" width="126" height="42" rx="18" fill="#101215" fill-opacity=".66" stroke="#343a44"/>
    <text x="126" y="185" class="body" fill="#f1f3f0" opacity=".82">prompts</text>

    <rect x="248" y="158" width="102" height="42" rx="18" fill="#101215" fill-opacity=".62" stroke="#343a44"/>
    <text x="277" y="185" class="body" fill="#f1f3f0" opacity=".78">fixes</text>
  </g>

  <!-- flow to review -->
  <path d="M374 146C428 146 454 146 500 146" fill="none" stroke="url(#flow)" stroke-width="3" marker-end="url(#arrowOxide)"/>
  <path d="M388 118C430 104 466 108 500 128" fill="none" stroke="#7f8792" stroke-opacity=".22" stroke-width="2" stroke-dasharray="7 9"/>
  <path d="M388 178C430 192 466 188 500 166" fill="none" stroke="#7f8792" stroke-opacity=".22" stroke-width="2" stroke-dasharray="7 9"/>

  <!-- review core -->
  <g filter="url(#softShadow)">
    <rect x="500" y="88" width="220" height="132" rx="24" fill="#101215" fill-opacity=".76" stroke="#343a44"/>
    <circle cx="610" cy="154" r="42" fill="none" stroke="#7f8792" stroke-opacity=".32" stroke-width="2"/>
    <circle cx="610" cy="154" r="22" fill="none" stroke="#d65a31" stroke-opacity=".86" stroke-width="3"/>
    <path d="M585 154H635M610 129V179" stroke="#d65a31" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
    <path d="M528 114H580M640 194H690" stroke="#a9b0b8" stroke-opacity=".25" stroke-width="2" stroke-linecap="round"/>
    <text x="546" y="248" class="micro" fill="#7f8792">CHECK / CHALLENGE / MERGE</text>
  </g>

  <!-- flow to findings -->
  <path d="M720 146C778 146 814 146 864 146" fill="none" stroke="url(#flow)" stroke-width="3" marker-end="url(#arrowOxide)"/>
  <path d="M732 118C786 94 820 100 856 122" fill="none" stroke="#7f8792" stroke-opacity=".20" stroke-width="2" stroke-dasharray="7 9"/>
  <path d="M732 178C786 202 820 196 856 170" fill="none" stroke="#7f8792" stroke-opacity=".20" stroke-width="2" stroke-dasharray="7 9"/>

  <!-- findings card -->
  <g filter="url(#softShadow)">
    <rect x="864" y="78" width="270" height="160" rx="24" fill="#101215" fill-opacity=".72" stroke="#343a44"/>
    <g>
      <text x="896" y="113" class="micro" fill="#d65a31">BREAK</text>
      <path d="M980 109H1092" stroke="#f1f3f0" stroke-opacity=".24" stroke-width="3" stroke-linecap="round"/>
    </g>
    <path d="M892 130H1110" stroke="#343a44"/>

    <g>
      <text x="896" y="153" class="micro" fill="#d65a31">EVIDENCE</text>
      <path d="M980 149H1076" stroke="#f1f3f0" stroke-opacity=".24" stroke-width="3" stroke-linecap="round"/>
    </g>
    <path d="M892 170H1110" stroke="#343a44"/>

    <g>
      <text x="896" y="193" class="micro" fill="#d65a31">SEVERITY</text>
      <rect x="980" y="179" width="44" height="20" rx="10" fill="#d65a31" fill-opacity=".20" stroke="#d65a31" stroke-opacity=".42"/>
      <circle cx="992" cy="189" r="4" fill="#d65a31"/>
    </g>
    <path d="M892 210H1110" stroke="#343a44"/>

    <g>
      <text x="896" y="231" class="micro" fill="#d65a31">FIX</text>
      <path d="M980 227H1088" stroke="#f1f3f0" stroke-opacity=".24" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ambient details -->
  <g opacity=".55">
    <circle cx="74" cy="248" r="4" fill="#d65a31"/>
    <path d="M84 248H256" stroke="#7f8792" stroke-opacity=".24"/>
    <circle cx="1134" cy="54" r="4" fill="#d6a84f"/>
    <path d="M960 54H1124" stroke="#7f8792" stroke-opacity=".22"/>
  </g>
</svg>
