<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Transition trace</title>
  <desc id="desc">A subtle operational trace showing three review rounds moving from loop to use cases.</desc>

  <defs>
    <linearGradient id="fadeLine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7f8792" stop-opacity="0"/>
      <stop offset=".16" stop-color="#7f8792" stop-opacity=".24"/>
      <stop offset=".5" stop-color="#d65a31" stop-opacity=".42"/>
      <stop offset=".84" stop-color="#7f8792" stop-opacity=".24"/>
      <stop offset="1" stop-color="#7f8792" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="softGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d65a31" stop-opacity=".26"/>
      <stop offset="1" stop-color="#d65a31" stop-opacity="0"/>
    </radialGradient>

    <marker id="arrowTrace" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d65a31" opacity=".72"/>
    </marker>

    <style>
      .label { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .16em; }
      .micro { font: 650 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .14em; }
    </style>
  </defs>

  <rect width="1200" height="180" fill="none"/>

  <ellipse cx="600" cy="92" rx="430" ry="52" fill="url(#softGlow)" opacity=".35"/>

  <path d="M120 92H1080" stroke="url(#fadeLine)" stroke-width="2"/>
  <path d="M202 92C298 48 405 48 500 92S704 136 798 92S962 46 1030 88" fill="none" stroke="#7f8792" stroke-opacity=".22" stroke-width="2" stroke-dasharray="7 10"/>
  <path d="M280 92H920" fill="none" stroke="#d65a31" stroke-opacity=".28" stroke-width="2" marker-end="url(#arrowTrace)"/>

  <g>
    <circle cx="260" cy="92" r="24" fill="#101215" fill-opacity=".72" stroke="#343a44"/>
    <circle cx="260" cy="92" r="8" fill="#d65a31" fill-opacity=".82"/>
    <text x="232" y="136" class="micro" fill="#7f8792">ROUND 1</text>
  </g>

  <g>
    <circle cx="600" cy="92" r="30" fill="#101215" fill-opacity=".82" stroke="#343a44"/>
    <circle cx="600" cy="92" r="14" fill="none" stroke="#d65a31" stroke-width="3" stroke-opacity=".86"/>
    <path d="M589 92H611M600 81V103" stroke="#d65a31" stroke-width="2.5" stroke-linecap="round"/>
    <text x="561" y="142" class="micro" fill="#a9b0b8">PRESSURE</text>
  </g>

  <g>
    <circle cx="940" cy="92" r="24" fill="#101215" fill-opacity=".72" stroke="#343a44"/>
    <path d="M929 92l7 8 16-18" fill="none" stroke="#d6a84f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="908" y="136" class="micro" fill="#7f8792">SURVIVES</text>
  </g>

  <g opacity=".8">
    <rect x="356" y="58" width="94" height="20" rx="8" fill="#101215" fill-opacity=".56" stroke="#343a44"/>
    <text x="374" y="72" class="micro" fill="#d65a31">BREAK</text>

    <rect x="744" y="108" width="112" height="20" rx="8" fill="#101215" fill-opacity=".50" stroke="#343a44"/>
    <text x="762" y="122" class="micro" fill="#a9b0b8">EVIDENCE</text>
  </g>

  <g opacity=".42">
    <path d="M170 42H322" stroke="#7f8792"/>
    <path d="M878 146H1030" stroke="#7f8792"/>
    <circle cx="170" cy="42" r="3" fill="#d65a31"/>
    <circle cx="1030" cy="146" r="3" fill="#d6a84f"/>
  </g>

  <text x="500" y="36" class="label" fill="#d65a31" opacity=".78">LOOP TRACE</text>
</svg>
